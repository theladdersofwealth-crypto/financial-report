name = "financial-report"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[build]
command = "node scripts/prepare-market-snapshot.mjs"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[vars]
BOOTSTRAP_TOKEN_SHA256 = "5e859f6f55ecd2238eb2adde4cb742cf9cc89b65689ef23774869d8e3fb482de"

[[durable_objects.bindings]]
name = "DESK"
class_name = "DeskRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeskRoom"]

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]
